<div class="border-border bg-primary h-full rounded-md border p-4">
  <div class="mb-4 flex items-center gap-2">
    <div class="bg-surface flex h-10 w-10 items-center justify-center rounded-md font-bold">
      {{ wallet().name[0].toUpperCase() }}
    </div>
    <app-button
      variant="empty"
      class="text-foreground-muted hover:bg-surface ml-auto flex h-6 w-6 cursor-pointer items-center justify-center rounded-full transition-all hover:text-blue-500"
    >
      <i class="pi pi-pencil"></i>
    </app-button>
    <app-delete-wallet-button [walletId]="wallet().id" />
  </div>
  <h2 class="mb-4 text-base font-semibold">{{ wallet().name }}</h2>

  <p class="mb-4 text-lg font-bold">
    {{ wallet().balance | currency: currencyLabel() }}
  </p>

  <div class="border-border flex items-center justify-between border-t pt-4">
    <p class="text-foreground-muted">42 transactions</p>
    <p class="font-semibold text-green-500">+2.4%</p>
  </div>
</div>
